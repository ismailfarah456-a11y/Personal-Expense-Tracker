<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="summary">
      <div class="card">
        <h3>Balance</h3>
        <p id="balance">£0.00</p>
      </div>
      <div class="card">
        <h3>Income</h3>
        <p id="income" class="income">£0.00</p>
      </div>
      <div class="card">
        <h3>Expenses</h3>
        <p id="expense" class="expense">£0.00</p>
      </div>
    </div>

    <div class="section">
      <h2>Add Transaction</h2>
      <form id="form">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Groceries">

        <label for="amount">Amount (£)</label>
        <input type="number" id="amount" step="0.01" placeholder="0.00">

        <label for="type">Type</label>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <label for="category">Category</label>
        <select id="category">
          <option value="">-- Select a category --</option>
          <option value="Salary">Salary</option>
          <option value="Food">Food</option>
          <option value="Rent">Rent</option>
          <option value="Utilities">Utilities</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>

        <p id="error" class="error"></p>

        <button type="submit">Add Transaction</button>
      </form>
    </div>

    <div class="section">
      <div class="history-header">
        <h2>History</h2>
        <select id="filter">
          <option value="All">All Categories</option>
          <option value="Salary">Salary</option>
          <option value="Food">Food</option>
          <option value="Rent">Rent</option>
          <option value="Utilities">Utilities</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <ul id="list"></ul>
      <p id="empty-message" class="empty-message">No transactions to show.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
